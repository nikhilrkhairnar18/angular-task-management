<section class="stats" aria-label="Task statistics">
  <article class="stat-card">
    <h2>Total</h2>
    <p class="value">{{ stats().total }}</p>
  </article>
  <article class="stat-card">
    <h2>Completed</h2>
    <p class="value completed">{{ stats().completed }}</p>
  </article>
  <article class="stat-card">
    <h2>In progress</h2>
    <p class="value in-progress">{{ stats().inProgress }}</p>
  </article>
  <article class="stat-card">
    <h2>Overdue</h2>
    <p class="value overdue">{{ stats().overdue }}</p>
  </article>
</section>
